<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Cake Builder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#fff0f5;
}

header{
    background:#ff6f61;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    display:flex;
    justify-content:center;
    gap:30px;
    background:#ff9aa2;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.builder{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

/* Cake Preview */
.preview{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    text-align:center;
}

#cakeBox{
    width:300px;
    height:300px;
    margin:auto;
    border:2px dashed #ff6f61;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    border-radius:50%;
    transition:0.3s;
}

/* Options Panel */
.options{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    color:#ff6f61;
    margin-bottom:10px;
}

label{
    display:block;
    margin-top:10px;
}

select, input, button{
    width:100%;
    padding:8px;
    margin-top:5px;
    border-radius:5px;
    border:1px solid #ccc;
}

.addons{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.price-box{
    background:#ffe0e0;
    padding:10px;
    margin-top:15px;
    font-weight:bold;
    text-align:center;
}

button{
    background:#ff6f61;
    color:white;
    border:none;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#ff3b2f;
}

/* Responsive */
@media(max-width:768px){
    .builder{
        grid-template-columns:1fr;
    }
}

footer{
    background:#ff6f61;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>Design Your Custom Cake</h1>
<p>Create your dream cake online</p>
</header>

<nav>
<a href="#">Shape & Flavor</a>
<a href="#">Decorations</a>
<a href="#">Add-ons</a>
<a href="#">Checkout</a>
</nav>

<div class="container">

<div class="builder">

<!-- LEFT: CAKE PREVIEW -->
<div class="preview">
<h2>Live Cake Preview</h2>
<div id="cakeBox">Your Cake</div>
<p id="previewText"></p>
<img id="photoPreview" style="max-width:200px; margin-top:10px; display:none;">
</div>

<!-- RIGHT: CUSTOMIZER -->
<div class="options">

<h2>Step 1: Shape & Size</h2>
<label>Shape:</label>
<select id="shape">
<option value="round">Round</option>
<option value="square">Square</option>
<option value="heart">Heart</option>
<option value="tiered">Tiered</option>
</select>

<label>Size:</label>
<select id="size">
<option value="1kg">1 kg</option>
<option value="1.5kg">1.5 kg</option>
<option value="2kg">2 kg</option>
<option value="3kg">3 kg</option>
<option value="5kg">5 kg</option>
</select>

<h2>Step 2: Flavor</h2>
<label>Flavor:</label>
<select id="flavor">
<option value="chocolate">Chocolate</option>
<option value="vanilla">Vanilla</option>
<option value="redvelvet">Red Velvet</option>
<option value="strawberry">Strawberry</option>
<option value="blackforest">Black Forest</option>
</select>

<h2>Step 3: Decorations</h2>
<label>Add Message:</label>
<input type="text" id="message" placeholder="Happy Birthday!">

<label>Upload Photo:</label>
<input type="file" id="photo" accept="image/*">

<label>Icing Color:</label>
<input type="color" id="color" value="#ffccdd">

<h2>Step 4: Add-ons</h2>
<div class="addons">
<label><input type="checkbox" class="addon" value="50"> Candles (+₹50)</label>
<label><input type="checkbox" class="addon" value="100"> Balloons (+₹100)</label>
<label><input type="checkbox" class="addon" value="80"> Greeting Card (+₹80)</label>
<label><input type="checkbox" class="addon" value="60"> Ribbon (+₹60)</label>
</div>

<div class="price-box">
Total Price: ₹<span id="price">300</span>
</div>

<button onclick="checkout()">Proceed to Checkout</button>

</div>
</div>
</div>

<footer>
© 2026 Custom Cake Designer | All Rights Reserved
</footer>

<script>
const cakeBox = document.getElementById("cakeBox");
const previewText = document.getElementById("previewText");
const photoPreview = document.getElementById("photoPreview");
const priceEl = document.getElementById("price");

function updateCake(){
    let shape = document.getElementById("shape").value;
    let size = document.getElementById("size").value;
    let flavor = document.getElementById("flavor").value;
    let message = document.getElementById("message").value;
    let color = document.getElementById("color").value;

    cakeBox.style.background = color;

    if(shape === "square"){
        cakeBox.style.borderRadius = "10px";
    } else if(shape === "heart"){
        cakeBox.style.borderRadius = "50% 50% 40% 40%";
    } else {
        cakeBox.style.borderRadius = "50%";
    }

    previewText.innerHTML = 
    `<b>${size.toUpperCase()} ${flavor.toUpperCase()} ${shape.toUpperCase()} CAKE</b><br>
    Message: ${message}`;

    calculatePrice();
}

function calculatePrice(){
    let base = 300;
    let size = document.getElementById("size").value;

    if(size === "1.5kg") base += 100;
    if(size === "2kg") base += 200;
    if(size === "3kg") base += 350;
    if(size === "5kg") base += 700;

    let flavor = document.getElementById("flavor").value;
    if(flavor === "redvelvet" || flavor === "blackforest") base += 100;

    document.querySelectorAll(".addon").forEach(add=>{
        if(add.checked) base += Number(add.value);
    });

    priceEl.innerText = base;
}

document.getElementById("shape").addEventListener("change", updateCake);
document.getElementById("size").addEventListener("change", updateCake);
document.getElementById("flavor").addEventListener("change", updateCake);
document.getElementById("message").addEventListener("input", updateCake);
document.getElementById("color").addEventListener("input", updateCake);

document.getElementById("photo").addEventListener("change", function(event){
    const file = event.target.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(e){
            photoPreview.src = e.target.result;
            photoPreview.style.display = "block";
        }
        reader.readAsDataURL(file);
    }
});

document.querySelectorAll(".addon").forEach(add=>{
    add.addEventListener("change", calculatePrice);
});

function checkout(){
    alert("Order Placed! Redirecting to Payment...");
}

updateCake();
</script>

</body>
</html>
